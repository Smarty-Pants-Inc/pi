merge_queue:
  mode: serial
  max_parallel_checks: 2
  reset_on_external_merge: always

# smarty-dev's plain rule (smarty-dev#865): the PR, its required checks and this queue are the
# review. The Astra reviewer queues a ready PR after its success verdict; `hold` and DO NOT LAND
# titles keep a PR out.
queue_rules:
  - name: default
    batch_size: 1
    checks_timeout: 180 min
    merge_method: merge
    queue_conditions:
      - base = main
      - -draft
      - -label = hold
      - -title ~= (?i)do not land
      - check-success = review/astra
      # A PR that needs a named security pass (label needs-security-pass) waits for its
      # review/security status, which the pass posts on the exact head (smarty-dev#806, #817).
      - or:
          - -label = needs-security-pass
          - check-success = review/security
      # An automated upstream sync (branch sync/upstream-*, bin/smarty-fork-sync) always waits for
      # review/security; pi-security-astra acts on those heads (smarty-dev#755, #1004).
      - or:
          - -head ~= ^sync/upstream-
          - check-success = review/security
      - check-success = smarty-ci
      - -check-failure = smarty-ci
    merge_conditions:
      - check-success = smarty-ci
      - -check-failure = smarty-ci

# The fleet's write App bot may queue (smarty-dev#735, #736): GitHub reports App bots as permission
# none, so the default `sender-permission >= write` restriction refused its queue commands.
commands_restrictions:
  queue:
    conditions:
      - or:
          - sender-permission >= write
          - sender = smarty-fleet-write[bot]
  # The stuck-work check's R4 posts one `@mergifyio refresh` per head as the write App (smarty-dev#868,
  # #983); without this Mergify answers "Command disallowed".
  refresh:
    conditions:
      - or:
          - sender-permission >= write
          - sender = smarty-fleet-write[bot]
