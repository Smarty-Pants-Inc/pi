    - name: Retain final source state including failure deltas
      if: always()
      timeout-minutes: 3
      run: |
        set -euo pipefail
        umask 077
        evidence="$RUNNER_TEMP/pi-emergency/evidence"
        mkdir -p "$evidence"
        if git rev-parse --is-inside-work-tree; then
          git rev-parse HEAD HEAD^{tree} > "$evidence/after-job-head-tree.txt"
          git write-tree > "$evidence/after-job-index-tree.txt"
          git status --porcelain --untracked-files=all > "$evidence/after-job-status.txt"
          git diff --binary HEAD -- > "$evidence/after-job-source.diff"
          git diff --binary --cached HEAD -- > "$evidence/after-job-index.diff"
          if git cat-file -e 66a10373a381faa3ccb8514cc81d580e363e9f24; then
            git diff --binary 66a10373a381faa3ccb8514cc81d580e363e9f24 -- > "$evidence/after-job-candidate.diff"
            test "$(git rev-parse HEAD)" = "45a41b0448ae03a74fbb2caaf7ba799ca2e8d5b2"
            test "$(git write-tree)" = "66a10373a381faa3ccb8514cc81d580e363e9f24"
            git diff --exit-code 66a10373a381faa3ccb8514cc81d580e363e9f24 --
          else
            printf '%s\n' 'Expected candidate tree absent; not accepted' > "$evidence/candidate-missing.txt"
            exit 1
          fi
        else
          printf '%s\n' 'Checkout unavailable; not accepted' > "$evidence/checkout-missing.txt"
          exit 1
        fi
        df -k . "$evidence" > "$evidence/final-disk.txt"
    - name: Upload actual evidence even after failure
      if: always()
      timeout-minutes: 5
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: pi-compaction-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/pi-emergency/evidence
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
