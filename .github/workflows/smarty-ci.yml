name: smarty-ci
# Aggregate check required by the reviewed Mergify queue.

on:
  pull_request:
    branches:
      - main
      # Temporary landed home of the fleet's a2 runtime line (smarty-dev#7403); retired with v1.1.0.
      - release/runtime-a2
  push:
    branches:
      - main
      - tmp-mergify/merge-queue/**
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact separately accepted successor source commit
        required: true
        type: string
      source_tree:
        description: Exact accepted successor source tree
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: smarty-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  smarty-ci:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Pi full gate not requested' || 'smarty-ci' }}
    # Same-repository PRs are write-authorized, including current/future org write Apps
    # (smarty-dev#2177); admit them without contributor or bot-author allowlists.
    # Fork source remains excluded from this runner; retired pr-gate.yml stays deleted.
    if: (github.event_name != 'workflow_dispatch') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    # Pushes (main, the install artifact; queue drafts), queue-draft PRs and priority-ci PRs use the existing priority pool
    # (runners-lead, 2026-10-13; push routing smarty-dev#12205). Push events carry no head_ref or labels.
    runs-on: ${{ (github.event_name == 'push' || startsWith(github.head_ref, 'mergify/merge-queue/') || startsWith(github.head_ref, 'tmp-mergify/merge-queue/') || contains(github.event.pull_request.labels.*.name, 'priority-ci')) && 'smarty-priority' || 'smarty-linux-x64' }}
    # Forge disposable VMs: 2 vCPU / 8 GB, up to 7 VMs in the shared pool.
    timeout-minutes: 150
    steps:
    - name: Install Forge base prerequisites
      timeout-minutes: 10
      run: |
        sudo apt-get update
        sudo apt-get install -y ca-certificates curl git python3 python3-yaml build-essential pkg-config
    - name: Checkout exact qualification source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        # The hosted-runner guard reads its approval lists from a trusted base: depth 2
        # brings a PR's base commit; a merge-queue push needs full history and
        # origin/main for the merge base (0 = all history and branches).
        fetch-depth: ${{ (github.event_name == 'push' && github.ref != 'refs/heads/main') && '0' || '2' }}
        persist-credentials: false
      timeout-minutes: 5
    - name: Reject unapproved hosted runners
      env:
        # Empty on push; the guard then uses the checkout (main) or the merge base with main.
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: bash scripts/ci/no-hosted-runners.sh
    - name: Test hosted-runner guard
      run: bash scripts/ci/test-no-hosted-runners.sh
    - name: Setup Node22
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 22.23.2
      timeout-minutes: 5
    - name: Receive source identity and prepare private job state
      env:
        EXPECTED_SOURCE: ${{ github.sha }}
        EXPECTED_TREE: ''
        DEFINITION_SHA: ${{ github.workflow_sha }}
      run: |
        umask 077
        mkdir -m 700 "$RUNNER_TEMP/pi-emergency"
        mkdir -p "$RUNNER_TEMP/pi-emergency"/{evidence,home/.config,tmp,cache}
        touch "$RUNNER_TEMP/pi-emergency/npm-userconfig" "$RUNNER_TEMP/pi-emergency/npm-globalconfig"
        python3 - <<'PY'
        import json,os,pathlib,subprocess
        assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['EXPECTED_SOURCE']
        actual_tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
        if os.environ['EXPECTED_TREE']:
            assert actual_tree==os.environ['EXPECTED_TREE']
            assert actual_tree not in {'4d498710fc83ab1d34053dd03080c117a98d3a11','4e119a8542a59a94dd3f195c54ec72ecc172f00a','96fa8e837eb95739e80fee9442922bf6a21e9220'},'blocked predecessor source'
        assert not subprocess.check_output(['git','diff','HEAD','--'])
        assert os.uname().machine=='x86_64' and os.uname().sysname=='Linux'
        os_release=pathlib.Path('/etc/os-release').read_text()
        assert 'VERSION_ID="24.04"' in os_release and 'ID=ubuntu' in os_release
        record={k:os.environ.get(k) for k in ('EXPECTED_SOURCE','EXPECTED_TREE','DEFINITION_SHA','GITHUB_REPOSITORY','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','GITHUB_JOB','GITHUB_SHA','GITHUB_WORKFLOW_REF','RUNNER_NAME','RUNNER_OS','RUNNER_ARCH')}
        record['actual_tree']=actual_tree
        record['os_release']=os_release
        record['scope']='Full event-source build/check/test and Node package gate; not Bun, affected-session or activation acceptance'
        pathlib.Path(os.environ['RUNNER_TEMP'],'pi-emergency/evidence/identity.json').write_text(json.dumps(record,indent=2)+'\n')
        PY
        { node --version; npm --version; git --version; uname -a; id; getconf _NPROCESSORS_ONLN; free -b; df -k .; } > "$RUNNER_TEMP/pi-emergency/evidence/tools-and-host.txt"
        sha256sum "$(command -v node)" package-lock.json package.json > "$RUNNER_TEMP/pi-emergency/evidence/input-sha256.txt"
        test ! -L .local
        mkdir -p .local
        python3 - <<'PY'
        import base64,pathlib
        with pathlib.Path('.local/pack-stage.mjs').open('xb') as f:
            f.write(base64.b64decode(''))
        PY
        printf '%s\n' '9079195c71975702fe34ccf91293c3ff6fad0f4b8059edfcb4ce127761ff5eaa  .local/pack-stage.mjs' | sha256sum --check
        cp .local/pack-stage.mjs "$RUNNER_TEMP/pi-emergency/evidence/"
      timeout-minutes: 2
    - name: Disposable Forge system dependencies
      timeout-minutes: 10
      run: |
        set -o pipefail
        {
          sudo apt-get update &&
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep &&
          sudo ln -s "$(command -v fdfind)" /usr/local/bin/fd
        } 2>&1 | tee "$RUNNER_TEMP/pi-emergency/evidence/system-dependencies.log"
    - name: dependencies
      timeout-minutes: 10
      run: |
        set -o pipefail
        env -i PATH="$PATH" HOME="$RUNNER_TEMP/pi-emergency/home" USERPROFILE="$RUNNER_TEMP/pi-emergency/home" \
          TMPDIR="$RUNNER_TEMP/pi-emergency/tmp" TMP="$RUNNER_TEMP/pi-emergency/tmp" TEMP="$RUNNER_TEMP/pi-emergency/tmp" \
          XDG_CONFIG_HOME="$RUNNER_TEMP/pi-emergency/home/.config" XDG_CACHE_HOME="$RUNNER_TEMP/pi-emergency/cache" \
          PI_CODING_AGENT_DIR="$RUNNER_TEMP/pi-emergency/home/.pi/agent" PI_OFFLINE=1 PI_TELEMETRY=0 PI_NO_LOCAL_LLM=1 \
          AWS_EC2_METADATA_DISABLED=true CI=true GITHUB_ACTIONS=true LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC \
          GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 GIT_ASKPASS=/usr/bin/false GIT_EDITOR=true GIT_SEQUENCE_EDITOR=true \
          NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/pi-emergency/npm-userconfig" NPM_CONFIG_GLOBALCONFIG="$RUNNER_TEMP/pi-emergency/npm-globalconfig" \
          NPM_CONFIG_CACHE="$RUNNER_TEMP/pi-emergency/cache/npm" npm_config_jobs=1 GOMAXPROCS=2 NODE_OPTIONS=--max-old-space-size=4096 \
          STAGE_DIR="$RUNNER_TEMP/pi-emergency/stage" EVIDENCE_DIR="$RUNNER_TEMP/pi-emergency/evidence" \
          bash --noprofile --norc -euo pipefail 2>&1 <<'PI_JOB' | tee "$RUNNER_TEMP/pi-emergency/evidence/dependencies.log"
        npm ci --ignore-scripts
        PI_JOB
    - name: hydrate-pinned-model-data
      timeout-minutes: 5
      run: |
        set -o pipefail
        env -i PATH="$PATH" HOME="$RUNNER_TEMP/pi-emergency/home" USERPROFILE="$RUNNER_TEMP/pi-emergency/home" \
          TMPDIR="$RUNNER_TEMP/pi-emergency/tmp" TMP="$RUNNER_TEMP/pi-emergency/tmp" TEMP="$RUNNER_TEMP/pi-emergency/tmp" \
          XDG_CONFIG_HOME="$RUNNER_TEMP/pi-emergency/home/.config" XDG_CACHE_HOME="$RUNNER_TEMP/pi-emergency/cache" \
          PI_CODING_AGENT_DIR="$RUNNER_TEMP/pi-emergency/home/.pi/agent" PI_OFFLINE=1 PI_TELEMETRY=0 PI_NO_LOCAL_LLM=1 \
          AWS_EC2_METADATA_DISABLED=true CI=true GITHUB_ACTIONS=true LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC \
          GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 GIT_ASKPASS=/usr/bin/false GIT_EDITOR=true GIT_SEQUENCE_EDITOR=true \
          NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/pi-emergency/npm-userconfig" NPM_CONFIG_GLOBALCONFIG="$RUNNER_TEMP/pi-emergency/npm-globalconfig" \
          NPM_CONFIG_CACHE="$RUNNER_TEMP/pi-emergency/cache/npm" npm_config_jobs=1 GOMAXPROCS=2 NODE_OPTIONS=--max-old-space-size=4096 \
          STAGE_DIR="$RUNNER_TEMP/pi-emergency/stage" EVIDENCE_DIR="$RUNNER_TEMP/pi-emergency/evidence" \
          bash --noprofile --norc -euo pipefail 2>&1 <<'PI_JOB' | tee "$RUNNER_TEMP/pi-emergency/evidence/hydrate-pinned-model-data.log"
        # Hydrate the immutable typed catalog pinned by upstream nix/package.nix.
        # Never use hydrate:model-data here: that generator reads live provider catalogs.
        revision="$(python3 -c 'import json,re; r=json.load(open("nix/model-catalog.json"))["revision"]; assert re.fullmatch(r"sha256-[0-9a-f]{64}",r); print(r)')"
        catalog="$EVIDENCE_DIR/pinned-model-catalog.json"
        curl --fail --silent --show-error --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 120 \
          "https://pi.dev/api/models/revisions/${revision}?types=chat,image,classifier" --output "$catalog"
        printf '%s  %s\n' "${revision#sha256-}" "$catalog" | sha256sum --check
        node packages/ai/scripts/hydrate-model-catalog.ts "$catalog"
        git diff --exit-code HEAD --
        PI_JOB
    - name: public-model-data
      timeout-minutes: 5
      run: |
        set -o pipefail
        env -i PATH="$PATH" HOME="$RUNNER_TEMP/pi-emergency/home" USERPROFILE="$RUNNER_TEMP/pi-emergency/home" \
          TMPDIR="$RUNNER_TEMP/pi-emergency/tmp" TMP="$RUNNER_TEMP/pi-emergency/tmp" TEMP="$RUNNER_TEMP/pi-emergency/tmp" \
          XDG_CONFIG_HOME="$RUNNER_TEMP/pi-emergency/home/.config" XDG_CACHE_HOME="$RUNNER_TEMP/pi-emergency/cache" \
          PI_CODING_AGENT_DIR="$RUNNER_TEMP/pi-emergency/home/.pi/agent" PI_OFFLINE=1 PI_TELEMETRY=0 PI_NO_LOCAL_LLM=1 \
          AWS_EC2_METADATA_DISABLED=true CI=true GITHUB_ACTIONS=true LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC \
          GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 GIT_ASKPASS=/usr/bin/false GIT_EDITOR=true GIT_SEQUENCE_EDITOR=true \
          NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/pi-emergency/npm-userconfig" NPM_CONFIG_GLOBALCONFIG="$RUNNER_TEMP/pi-emergency/npm-globalconfig" \
          NPM_CONFIG_CACHE="$RUNNER_TEMP/pi-emergency/cache/npm" npm_config_jobs=1 GOMAXPROCS=2 NODE_OPTIONS=--max-old-space-size=4096 \
          STAGE_DIR="$RUNNER_TEMP/pi-emergency/stage" EVIDENCE_DIR="$RUNNER_TEMP/pi-emergency/evidence" \
          bash --noprofile --norc -euo pipefail 2>&1 <<'PI_JOB' | tee "$RUNNER_TEMP/pi-emergency/evidence/public-model-data.log"
        # Validate the pinned catalog hydrated by the preceding isolated step.
        npm --prefix packages/ai run check:model-data
        git diff --exit-code HEAD --
        cp -a packages/ai/src/providers/data "$EVIDENCE_DIR/model-data"
        find "$EVIDENCE_DIR/model-data" -type f -print0 | sort -z | xargs -0 sha256sum > "$EVIDENCE_DIR/model-data-sha256.txt"
        PI_JOB
    - name: build
      timeout-minutes: 20
      run: |
        set -o pipefail
        env -i PATH="$PATH" HOME="$RUNNER_TEMP/pi-emergency/home" USERPROFILE="$RUNNER_TEMP/pi-emergency/home" \
          TMPDIR="$RUNNER_TEMP/pi-emergency/tmp" TMP="$RUNNER_TEMP/pi-emergency/tmp" TEMP="$RUNNER_TEMP/pi-emergency/tmp" \
          XDG_CONFIG_HOME="$RUNNER_TEMP/pi-emergency/home/.config" XDG_CACHE_HOME="$RUNNER_TEMP/pi-emergency/cache" \
          PI_CODING_AGENT_DIR="$RUNNER_TEMP/pi-emergency/home/.pi/agent" PI_OFFLINE=1 PI_TELEMETRY=0 PI_NO_LOCAL_LLM=1 \
          AWS_EC2_METADATA_DISABLED=true CI=true GITHUB_ACTIONS=true LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC \
          GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 GIT_ASKPASS=/usr/bin/false GIT_EDITOR=true GIT_SEQUENCE_EDITOR=true \
          NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/pi-emergency/npm-userconfig" NPM_CONFIG_GLOBALCONFIG="$RUNNER_TEMP/pi-emergency/npm-globalconfig" \
          NPM_CONFIG_CACHE="$RUNNER_TEMP/pi-emergency/cache/npm" npm_config_jobs=1 GOMAXPROCS=2 NODE_OPTIONS=--max-old-space-size=4096 \
          STAGE_DIR="$RUNNER_TEMP/pi-emergency/stage" EVIDENCE_DIR="$RUNNER_TEMP/pi-emergency/evidence" \
          bash --noprofile --norc -euo pipefail 2>&1 <<'PI_JOB' | tee "$RUNNER_TEMP/pi-emergency/evidence/build.log"
        npm run build:offline
        git diff --exit-code HEAD --
        PI_JOB
    - name: check
      timeout-minutes: 20
      run: |
        set -o pipefail
        env -i PATH="$PATH" HOME="$RUNNER_TEMP/pi-emergency/home" USERPROFILE="$RUNNER_TEMP/pi-emergency/home" \
          TMPDIR="$RUNNER_TEMP/pi-emergency/tmp" TMP="$RUNNER_TEMP/pi-emergency/tmp" TEMP="$RUNNER_TEMP/pi-emergency/tmp" \
          XDG_CONFIG_HOME="$RUNNER_TEMP/pi-emergency/home/.config" XDG_CACHE_HOME="$RUNNER_TEMP/pi-emergency/cache" \
          PI_CODING_AGENT_DIR="$RUNNER_TEMP/pi-emergency/home/.pi/agent" PI_OFFLINE=1 PI_TELEMETRY=0 PI_NO_LOCAL_LLM=1 \
          AWS_EC2_METADATA_DISABLED=true CI=true GITHUB_ACTIONS=true LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC \
          GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 GIT_ASKPASS=/usr/bin/false GIT_EDITOR=true GIT_SEQUENCE_EDITOR=true \
          NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/pi-emergency/npm-userconfig" NPM_CONFIG_GLOBALCONFIG="$RUNNER_TEMP/pi-emergency/npm-globalconfig" \
          NPM_CONFIG_CACHE="$RUNNER_TEMP/pi-emergency/cache/npm" npm_config_jobs=1 GOMAXPROCS=2 NODE_OPTIONS=--max-old-space-size=4096 \
          STAGE_DIR="$RUNNER_TEMP/pi-emergency/stage" EVIDENCE_DIR="$RUNNER_TEMP/pi-emergency/evidence" \
          bash --noprofile --norc -euo pipefail 2>&1 <<'PI_JOB' | tee "$RUNNER_TEMP/pi-emergency/evidence/check.log"
        npm run check
        git diff --exit-code HEAD --
        PI_JOB
    - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      with:
        toolchain: 1.96.0
    - name: pi-env daemon
      # Upstream v1.0.x pi-env tests need the Rust daemon (upstream ci.yml builds it the same way).
      # Needs cargo with the toolchain pinned in packages/env/daemon/rust-toolchain.toml on the runner.
      timeout-minutes: 15
      run: |
        set -o pipefail
        npm run build:daemon --workspace packages/env 2>&1 | tee "$RUNNER_TEMP/pi-emergency/evidence/env-daemon.log"
    - name: complete-tests
      timeout-minutes: 60
      run: |
        set -o pipefail
        env -i PATH="$PATH" HOME="$RUNNER_TEMP/pi-emergency/home" USERPROFILE="$RUNNER_TEMP/pi-emergency/home" \
          TMPDIR="$RUNNER_TEMP/pi-emergency/tmp" TMP="$RUNNER_TEMP/pi-emergency/tmp" TEMP="$RUNNER_TEMP/pi-emergency/tmp" \
          XDG_CONFIG_HOME="$RUNNER_TEMP/pi-emergency/home/.config" XDG_CACHE_HOME="$RUNNER_TEMP/pi-emergency/cache" \
          PI_CODING_AGENT_DIR="$RUNNER_TEMP/pi-emergency/home/.pi/agent" PI_OFFLINE=1 PI_TELEMETRY=0 PI_NO_LOCAL_LLM=1 \
          AWS_EC2_METADATA_DISABLED=true CI=true GITHUB_ACTIONS=true LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC \
          GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 GIT_ASKPASS=/usr/bin/false GIT_EDITOR=true GIT_SEQUENCE_EDITOR=true \
          NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/pi-emergency/npm-userconfig" NPM_CONFIG_GLOBALCONFIG="$RUNNER_TEMP/pi-emergency/npm-globalconfig" \
          NPM_CONFIG_CACHE="$RUNNER_TEMP/pi-emergency/cache/npm" npm_config_jobs=1 GOMAXPROCS=2 NODE_OPTIONS=--max-old-space-size=4096 \
          STAGE_DIR="$RUNNER_TEMP/pi-emergency/stage" EVIDENCE_DIR="$RUNNER_TEMP/pi-emergency/evidence" \
          bash --noprofile --norc -euo pipefail 2>&1 <<'PI_JOB' | tee "$RUNNER_TEMP/pi-emergency/evidence/complete-tests.log"
        ./test.sh
        git diff --exit-code HEAD --
        PI_JOB
    - name: node-stage
      timeout-minutes: 10
      run: |
        set -o pipefail
        env -i PATH="$PATH" HOME="$RUNNER_TEMP/pi-emergency/home" USERPROFILE="$RUNNER_TEMP/pi-emergency/home" \
          TMPDIR="$RUNNER_TEMP/pi-emergency/tmp" TMP="$RUNNER_TEMP/pi-emergency/tmp" TEMP="$RUNNER_TEMP/pi-emergency/tmp" \
          XDG_CONFIG_HOME="$RUNNER_TEMP/pi-emergency/home/.config" XDG_CACHE_HOME="$RUNNER_TEMP/pi-emergency/cache" \
          PI_CODING_AGENT_DIR="$RUNNER_TEMP/pi-emergency/home/.pi/agent" PI_OFFLINE=1 PI_TELEMETRY=0 PI_NO_LOCAL_LLM=1 \
          AWS_EC2_METADATA_DISABLED=true CI=true GITHUB_ACTIONS=true LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC \
          GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 GIT_ASKPASS=/usr/bin/false GIT_EDITOR=true GIT_SEQUENCE_EDITOR=true \
          NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/pi-emergency/npm-userconfig" NPM_CONFIG_GLOBALCONFIG="$RUNNER_TEMP/pi-emergency/npm-globalconfig" \
          NPM_CONFIG_CACHE="$RUNNER_TEMP/pi-emergency/cache/npm" npm_config_jobs=1 GOMAXPROCS=2 NODE_OPTIONS=--max-old-space-size=4096 \
          STAGE_DIR="$RUNNER_TEMP/pi-emergency/stage" EVIDENCE_DIR="$RUNNER_TEMP/pi-emergency/evidence" \
          bash --noprofile --norc -euo pipefail 2>&1 <<'PI_JOB' | tee "$RUNNER_TEMP/pi-emergency/evidence/node-stage.log"
        node .local/pack-stage.mjs "$STAGE_DIR"
        mapfile -t emitted_archives < <(find "$STAGE_DIR/tarballs" -maxdepth 1 -type f -name "*.tgz" -print | sort)
        test "${#emitted_archives[@]}" -gt 0
        for archive in "${emitted_archives[@]}"; do
          python3 scripts/check-package-bin-modes.py "$archive"
        done
        git diff --exit-code HEAD --
        PI_JOB
    - name: Retain complete or partial stage with modes
      if: always()
      timeout-minutes: 3
      run: |
        umask 077
        evidence="$RUNNER_TEMP/pi-emergency/evidence"
        mkdir -p "$evidence"
        if test -d "$RUNNER_TEMP/pi-emergency/stage"; then
          tar -C "$RUNNER_TEMP/pi-emergency/stage" -czf "$evidence/node-stage.tar.gz" .
          sha256sum "$evidence/node-stage.tar.gz" > "$evidence/node-stage.tar.gz.sha256"
        fi
        if git rev-parse --is-inside-work-tree; then
          git diff --binary HEAD -- > "$evidence/after-job-source.diff"
        fi
        df -k . "$evidence" > "$evidence/final-disk.txt"
    - name: Upload actual evidence even after failure
      if: always()
      timeout-minutes: 5
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: pi-compaction-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/pi-emergency/evidence
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
  emergency-compaction:
    name: Pi emergency compaction regressions
    if: (github.event_name == 'workflow_dispatch') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: smarty-linux-x64
    timeout-minutes: 90
    steps:
    - name: Install Forge base prerequisites
      timeout-minutes: 10
      run: |
        sudo apt-get update
        sudo apt-get install -y ca-certificates curl git python3 build-essential pkg-config
    - name: Validate exact source syntax
      env:
        EXPECTED_SOURCE: ${{ inputs.source_sha }}
        EXPECTED_TREE: ${{ inputs.source_tree }}
      run: |
        python3 - <<'PY'
        import os,re
        assert os.environ['GITHUB_REPOSITORY']=='Smarty-Pants-Inc/pi'
        for key in ('EXPECTED_SOURCE','EXPECTED_TREE'):
            assert re.fullmatch('[0-9a-f]{40}',os.environ[key]),key
        PY
      timeout-minutes: 2
    - name: Checkout exact qualification source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.source_sha }}
        persist-credentials: false
      timeout-minutes: 5
    - name: Setup Node22
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 22.23.2
      timeout-minutes: 5
    - name: Receive source identity and prepare private job state
      env:
        EXPECTED_SOURCE: ${{ inputs.source_sha }}
        EXPECTED_TREE: ${{ inputs.source_tree }}
        DEFINITION_SHA: ${{ github.workflow_sha }}
      run: |
        umask 077
        mkdir -m 700 "$RUNNER_TEMP/pi-emergency"
        mkdir -p "$RUNNER_TEMP/pi-emergency"/{evidence,home/.config,tmp,cache}
        touch "$RUNNER_TEMP/pi-emergency/npm-userconfig" "$RUNNER_TEMP/pi-emergency/npm-globalconfig"
        python3 - <<'PY'
        import json,os,pathlib,subprocess
        assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['EXPECTED_SOURCE']
        actual_tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
        if os.environ['EXPECTED_TREE']:
            assert actual_tree==os.environ['EXPECTED_TREE']
            assert actual_tree not in {'4d498710fc83ab1d34053dd03080c117a98d3a11','4e119a8542a59a94dd3f195c54ec72ecc172f00a','96fa8e837eb95739e80fee9442922bf6a21e9220'},'blocked predecessor source'
        assert not subprocess.check_output(['git','diff','HEAD','--'])
        assert os.uname().machine=='x86_64' and os.uname().sysname=='Linux'
        os_release=pathlib.Path('/etc/os-release').read_text()
        assert 'VERSION_ID="24.04"' in os_release and 'ID=ubuntu' in os_release
        record={k:os.environ.get(k) for k in ('EXPECTED_SOURCE','EXPECTED_TREE','DEFINITION_SHA','GITHUB_REPOSITORY','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','GITHUB_JOB','GITHUB_SHA','GITHUB_WORKFLOW_REF','RUNNER_NAME','RUNNER_OS','RUNNER_ARCH')}
        record['actual_tree']=actual_tree
        record['os_release']=os_release
        record['scope']='Fast faux regressions plus the same Node package stage as smarty-ci; not full smarty-ci, landing, Bun, affected-session or activation acceptance'
        pathlib.Path(os.environ['RUNNER_TEMP'],'pi-emergency/evidence/identity.json').write_text(json.dumps(record,indent=2)+'\n')
        PY
        { node --version; npm --version; git --version; uname -a; id; getconf _NPROCESSORS_ONLN; free -b; df -k .; } > "$RUNNER_TEMP/pi-emergency/evidence/tools-and-host.txt"
        sha256sum "$(command -v node)" package-lock.json package.json > "$RUNNER_TEMP/pi-emergency/evidence/input-sha256.txt"
        test ! -L .local
        mkdir -p .local
        python3 - <<'PY'
        import base64,pathlib
        with pathlib.Path('.local/pack-stage.mjs').open('xb') as f:
            f.write(base64.b64decode(''))
        PY
        printf '%s\n' '9079195c71975702fe34ccf91293c3ff6fad0f4b8059edfcb4ce127761ff5eaa  .local/pack-stage.mjs' | sha256sum --check
        cp .local/pack-stage.mjs "$RUNNER_TEMP/pi-emergency/evidence/"
      timeout-minutes: 2
