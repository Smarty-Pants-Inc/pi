{
  "name": "smarty-ci",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "source_sha": {
          "description": "Exact accepted append contribution H",
          "required": true,
          "type": "string"
        },
        "source_tree": {
          "description": "Exact append tree",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "pi-append9767-${{ github.ref }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "append9767": {
      "name": "Pi append15 and source check diagnostic",
      "if": "github.event_name == 'workflow_dispatch'",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 60,
      "env": {
        "GIT_OPTIONAL_LOCKS": "0"
      },
      "steps": [
        {
          "name": "Validate exact source syntax",
          "env": {
            "EXPECTED_SOURCE": "${{ inputs.source_sha }}",
            "EXPECTED_TREE": "${{ inputs.source_tree }}"
          },
          "run": "python3 - <<'PY'\nimport os,re\nassert os.environ['GITHUB_REPOSITORY']=='Smarty-Pants-Inc/pi'\nfor key in ('EXPECTED_SOURCE','EXPECTED_TREE'):\n    assert re.fullmatch('[0-9a-f]{40}',os.environ[key]),key\nassert os.environ['EXPECTED_SOURCE']=='2f3983082119c74d24e6f5e6042d0f18273892a1'\nassert os.environ['EXPECTED_TREE']=='5cc4666f3f31b6660e640d2e6c0a01f4af60427a'\nPY\n",
          "timeout-minutes": 2
        },
        {
          "name": "Checkout exact qualification source",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ inputs.source_sha }}",
            "persist-credentials": false
          },
          "timeout-minutes": 5
        },
        {
          "name": "Setup Node22",
          "uses": "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020",
          "with": {
            "node-version": "22.23.2"
          },
          "timeout-minutes": 5
        },
        {
          "name": "Receive source identity and prepare private job state",
          "env": {
            "EXPECTED_SOURCE": "${{ inputs.source_sha }}",
            "EXPECTED_TREE": "${{ inputs.source_tree }}",
            "DEFINITION_SHA": "${{ github.workflow_sha }}",
            "EVIDENCE_DIR": "${{ runner.temp }}/pi-append9767/evidence",
            "EXPECTED_MAP": "${{ runner.temp }}/pi-append9767/expected-map.json",
            "PI_APPEND_INPUT_0_00": "",
            "PI_APPEND_INPUT_1_00": "",
            "PI_APPEND_INPUT_1_01": "",
            "PI_APPEND_INPUT_1_02": "",
            "PI_APPEND_INPUT_1_03": "",
            "PI_APPEND_INPUT_1_04": "",
            "PI_APPEND_INPUT_1_05": "",
            "PI_APPEND_INPUT_1_06": "",
            "PI_APPEND_INPUT_1_07": "",
            "PI_APPEND_INPUT_1_08": "",
            "PI_APPEND_INPUT_1_09": "",
            "PI_APPEND_INPUT_1_10": "",
            "PI_APPEND_INPUT_1_11": "",
            "PI_APPEND_INPUT_2_00": "",
            "PI_APPEND_INPUT_3_00": "",
            "PI_APPEND_INPUT_3_01": "",
            "PI_APPEND_INPUT_3_02": "",
            "PI_APPEND_INPUT_3_03": "",
            "PI_APPEND_INPUT_3_04": "",
            "PI_APPEND_INPUT_3_05": "",
            "PI_APPEND_INPUT_3_06": ""
          },
          "run": "umask 077\nmkdir -m 700 \"$RUNNER_TEMP/pi-append9767\"\nmkdir -p \"$RUNNER_TEMP/pi-append9767\"/{evidence,home/.config,tmp,cache}\ntouch \"$RUNNER_TEMP/pi-append9767/npm-userconfig\" \"$RUNNER_TEMP/pi-append9767/npm-globalconfig\"\npython3 - <<'PY'\nimport json,os,pathlib,subprocess\nassert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['EXPECTED_SOURCE']\nactual_tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()\nif os.environ['EXPECTED_TREE']:\n    assert actual_tree==os.environ['EXPECTED_TREE']\n    assert actual_tree not in {'4d498710fc83ab1d34053dd03080c117a98d3a11','4e119a8542a59a94dd3f195c54ec72ecc172f00a','96fa8e837eb95739e80fee9442922bf6a21e9220'},'blocked predecessor source'\nassert not subprocess.check_output(['git','diff','HEAD','--'])\nassert os.uname().machine=='x86_64' and os.uname().sysname=='Linux'\nos_release=pathlib.Path('/etc/os-release').read_text()\nassert 'VERSION_ID=\"24.04\"' in os_release and 'ID=ubuntu' in os_release\nrecord={k:os.environ.get(k) for k in ('EXPECTED_SOURCE','EXPECTED_TREE','DEFINITION_SHA','GITHUB_REPOSITORY','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','GITHUB_JOB','GITHUB_SHA','GITHUB_WORKFLOW_REF','RUNNER_NAME','RUNNER_OS','RUNNER_ARCH')}\nrecord['workspace']=str(pathlib.Path.cwd())\nrecord['node']=subprocess.check_output(['node','--version'],text=True).strip()\nassert record['node']=='v22.23.2'\nrecord['actual_tree']=actual_tree\nimport hashlib,shutil\nrecord['npm']=subprocess.check_output(['npm','--version'],text=True).strip()\nrecord['tool_files']={}\nfor tool in ['node','npm','git']:\n    path=pathlib.Path(shutil.which(tool)).resolve(); data=path.read_bytes()\n    record['tool_files'][tool]={'path':str(path),'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}\nrecord['os_release']=os_release\nrecord['scope']='Complete append15 plus root npm-check only; not Code test:pi, upstream-main, full Pi or native qualification'\npathlib.Path(os.environ['RUNNER_TEMP'],'pi-append9767/evidence/identity.json').write_text(json.dumps(record,indent=2)+'\\n')\nPY\n{ node --version; npm --version; git --version; uname -a; id; getconf _NPROCESSORS_ONLN; free -b; df -k .; } > \"$RUNNER_TEMP/pi-append9767/evidence/tools-and-host.txt\"\nsha256sum \"$(command -v node)\" package-lock.json package.json > \"$RUNNER_TEMP/pi-append9767/evidence/input-sha256.txt\"\npython3 -I -S - <<'PY'\nimport base64,zlib,os,pathlib\np=pathlib.Path(os.environ['RUNNER_TEMP'])/'pi-append9767'\n(p/'snapshot.py').write_bytes(zlib.decompress(base64.b64decode(''.join(os.environ.pop(k) for k in ['PI_APPEND_INPUT_0_00']))))\n(p/'expected-map.json').write_bytes(zlib.decompress(base64.b64decode(''.join(os.environ.pop(k) for k in ['PI_APPEND_INPUT_1_00', 'PI_APPEND_INPUT_1_01', 'PI_APPEND_INPUT_1_02', 'PI_APPEND_INPUT_1_03', 'PI_APPEND_INPUT_1_04', 'PI_APPEND_INPUT_1_05', 'PI_APPEND_INPUT_1_06', 'PI_APPEND_INPUT_1_07', 'PI_APPEND_INPUT_1_08', 'PI_APPEND_INPUT_1_09', 'PI_APPEND_INPUT_1_10', 'PI_APPEND_INPUT_1_11']))))\n(p/'prepare-catalog.py').write_bytes(zlib.decompress(base64.b64decode(''.join(os.environ.pop(k) for k in ['PI_APPEND_INPUT_2_00']))))\n(p/'catalog-input.json').write_bytes(zlib.decompress(base64.b64decode(''.join(os.environ.pop(k) for k in ['PI_APPEND_INPUT_3_00', 'PI_APPEND_INPUT_3_01', 'PI_APPEND_INPUT_3_02', 'PI_APPEND_INPUT_3_03', 'PI_APPEND_INPUT_3_04', 'PI_APPEND_INPUT_3_05', 'PI_APPEND_INPUT_3_06']))))\nPY\npython3 -I -S - <<'PY'\nimport hashlib,json,os,pathlib,stat,subprocess\nsha=lambda b:hashlib.sha256(b).hexdigest()\nassert os.environ['EXPECTED_SOURCE']=='2f3983082119c74d24e6f5e6042d0f18273892a1'\nassert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['EXPECTED_SOURCE']\nassert subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()=='5cc4666f3f31b6660e640d2e6c0a01f4af60427a'\nindex=pathlib.Path(subprocess.check_output(['git','rev-parse','--git-path','index'],text=True).strip())\nindex_before=index.read_bytes(); held=[]; report=[]\ntry:\n    for name,size,digest,blob in [('pi-test.bat',338,'d454a5a0e203d9009283b887720472b022b0853380758b11419c8547a32dbb88','048a99db8df91ad4440848c4ae7124ef4e978df8'),('pi-test.ps1',1670,'104b48d951ee241fd9f0e76e4915ada92f484de730e8d253566816f52c36f64d','610aeaeb2715ad662ff2f30e912e7503e22e27fa')]:\n        assert subprocess.check_output(['git','ls-files','--stage','--',name],text=True).strip()==f'100644 {blob} 0\\t{name}'\n        data=subprocess.check_output(['git','cat-file','blob',os.environ['EXPECTED_SOURCE']+':'+name])\n        assert len(data)==size and sha(data)==digest and b'\\r' not in data\n        fd=os.open(name,os.O_RDWR|os.O_NOFOLLOW);held.append(fd);s=os.fstat(fd)\n        assert stat.S_ISREG(s.st_mode) and stat.S_IMODE(s.st_mode)==0o644 and s.st_nlink==1\n        assert (s.st_dev,s.st_ino)==(os.lstat(name).st_dev,os.lstat(name).st_ino)\n        before=os.pread(fd,s.st_size+1,0)\n        assert before in (data,data.replace(b'\\n',b'\\r\\n')), 'unexpected initial checkout postimage'\n        report.append((name,fd,data,before,s))\n    for name,fd,data,before,s in report:\n        current=os.lstat(name);assert (current.st_dev,current.st_ino)==(s.st_dev,s.st_ino)\n        assert os.pread(fd,s.st_size+1,0)==before\n        if before!=data:\n            assert os.pwrite(fd,data,0)==len(data);os.ftruncate(fd,len(data));os.fsync(fd)\n        assert os.pread(fd,len(data)+1,0)==data and stat.S_IMODE(os.fstat(fd).st_mode)==0o644\n    assert index.read_bytes()==index_before\n    print(json.dumps({'initial_materialization':[{'path':n,'before_sha256':sha(b),'after_sha256':sha(d),'before_bytes':len(b),'after_bytes':len(d)} for n,f,d,b,s in report],'index_unchanged':True,'later_normalization':False}))\nfinally:\n    for fd in held:os.close(fd)\nPY\npython3 -I -S \"$RUNNER_TEMP/pi-append9767/prepare-catalog.py\" \"$RUNNER_TEMP/pi-append9767/catalog-input.json\" \"$RUNNER_TEMP/pi-append9767/evidence/catalog-preparation.json\"\npython3 -I -S \"$RUNNER_TEMP/pi-append9767/snapshot.py\" initial --require-original\n",
          "timeout-minutes": 2,
          "id": "append_identity"
        },
        {
          "name": "dependencies",
          "id": "append_dependencies",
          "if": "${{ !cancelled() && steps.append_identity.outcome == 'success' }}",
          "timeout-minutes": 10,
          "run": "env -i PATH=\"$PATH\" HOME=\"$RUNNER_TEMP/pi-append9767/home\" USERPROFILE=\"$RUNNER_TEMP/pi-append9767/home\" \\\n  TMPDIR=\"$RUNNER_TEMP/pi-append9767/tmp\" TMP=\"$RUNNER_TEMP/pi-append9767/tmp\" TEMP=\"$RUNNER_TEMP/pi-append9767/tmp\" \\\n  XDG_CONFIG_HOME=\"$RUNNER_TEMP/pi-append9767/home/.config\" XDG_CACHE_HOME=\"$RUNNER_TEMP/pi-append9767/cache\" \\\n  PI_CODING_AGENT_DIR=\"$RUNNER_TEMP/pi-append9767/home/.pi/agent\" PI_OFFLINE=1 PI_TELEMETRY=0 PI_NO_LOCAL_LLM=1 \\\n  AWS_EC2_METADATA_DISABLED=true CI=true GITHUB_ACTIONS=true LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC \\\n  GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 GIT_ASKPASS=/usr/bin/false GIT_EDITOR=true GIT_SEQUENCE_EDITOR=true \\\n  NPM_CONFIG_USERCONFIG=\"$RUNNER_TEMP/pi-append9767/npm-userconfig\" NPM_CONFIG_GLOBALCONFIG=\"$RUNNER_TEMP/pi-append9767/npm-globalconfig\" \\\n  NPM_CONFIG_CACHE=\"$RUNNER_TEMP/pi-append9767/cache/npm\" npm_config_jobs=1 GOMAXPROCS=2 NODE_OPTIONS=--max-old-space-size=4096 \\\n  STAGE_DIR=\"$RUNNER_TEMP/pi-append9767/stage\" EVIDENCE_DIR=\"$RUNNER_TEMP/pi-append9767/evidence\" \\\n  EXPECTED_MAP=\"$RUNNER_TEMP/pi-append9767/expected-map.json\" SNAPSHOT=\"$RUNNER_TEMP/pi-append9767/snapshot.py\" GIT_OPTIONAL_LOCKS=0 \\\n  bash --noprofile --norc -euo pipefail <<'PI_JOB'\ncandidate=\"$PWD\"\npython3 -I -S \"$SNAPSHOT\" dependencies-before --require-original\nstart=$(date +%s%N)\nset +e\nnpm ci --ignore-scripts > \"$EVIDENCE_DIR/dependencies.stdout\" 2> \"$EVIDENCE_DIR/dependencies.stderr\"\nstatus=$?\nset -e\nend=$(date +%s%N)\npython3 -I -S - \"$status\" \"$start\" \"$end\" \"$candidate\" <<'PY'\nimport hashlib,json,os,pathlib,sys\nout=pathlib.Path(os.environ['EVIDENCE_DIR']);argv=['npm', 'ci', '--ignore-scripts'];argv=[v.replace('CANDIDATE',sys.argv[4]) for v in argv]\nr={'phase':'dependencies','argv':argv,'cwd':os.getcwd(),'exit':int(sys.argv[1]),'started_ns':int(sys.argv[2]),'ended_ns':int(sys.argv[3])}\nfor stream in ['stdout','stderr']:\n b=(out/('dependencies'+'.'+stream)).read_bytes();r[stream]={'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()}\nwith (out/('dependencies'+'.phase.json')).open('x') as f:json.dump(r,f,indent=2)\nPY\ncat \"$EVIDENCE_DIR/dependencies.stdout\"\ncat \"$EVIDENCE_DIR/dependencies.stderr\" >&2\ncd \"$candidate\"\npython3 -I -S \"$SNAPSHOT\" dependencies-after\nexit \"$status\"\nPI_JOB\n"
        },
        {
          "name": "append15",
          "id": "append15",
          "if": "${{ !cancelled() && steps.append_dependencies.outcome == 'success' }}",
          "timeout-minutes": 10,
          "run": "env -i PATH=\"$PATH\" HOME=\"$RUNNER_TEMP/pi-append9767/home\" USERPROFILE=\"$RUNNER_TEMP/pi-append9767/home\" \\\n  TMPDIR=\"$RUNNER_TEMP/pi-append9767/tmp\" TMP=\"$RUNNER_TEMP/pi-append9767/tmp\" TEMP=\"$RUNNER_TEMP/pi-append9767/tmp\" \\\n  XDG_CONFIG_HOME=\"$RUNNER_TEMP/pi-append9767/home/.config\" XDG_CACHE_HOME=\"$RUNNER_TEMP/pi-append9767/cache\" \\\n  PI_CODING_AGENT_DIR=\"$RUNNER_TEMP/pi-append9767/home/.pi/agent\" PI_OFFLINE=1 PI_TELEMETRY=0 PI_NO_LOCAL_LLM=1 \\\n  AWS_EC2_METADATA_DISABLED=true CI=true GITHUB_ACTIONS=true LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC \\\n  GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 GIT_ASKPASS=/usr/bin/false GIT_EDITOR=true GIT_SEQUENCE_EDITOR=true \\\n  NPM_CONFIG_USERCONFIG=\"$RUNNER_TEMP/pi-append9767/npm-userconfig\" NPM_CONFIG_GLOBALCONFIG=\"$RUNNER_TEMP/pi-append9767/npm-globalconfig\" \\\n  NPM_CONFIG_CACHE=\"$RUNNER_TEMP/pi-append9767/cache/npm\" npm_config_jobs=1 GOMAXPROCS=2 NODE_OPTIONS=--max-old-space-size=4096 \\\n  STAGE_DIR=\"$RUNNER_TEMP/pi-append9767/stage\" EVIDENCE_DIR=\"$RUNNER_TEMP/pi-append9767/evidence\" \\\n  EXPECTED_MAP=\"$RUNNER_TEMP/pi-append9767/expected-map.json\" SNAPSHOT=\"$RUNNER_TEMP/pi-append9767/snapshot.py\" GIT_OPTIONAL_LOCKS=0 \\\n  bash --noprofile --norc -euo pipefail <<'PI_JOB'\ncandidate=\"$PWD\"\npython3 -I -S \"$SNAPSHOT\" append15-before --require-original\ncd \"$candidate/packages/coding-agent\"\nstart=$(date +%s%N)\nset +e\nnode \"$candidate/node_modules/vitest/dist/cli.js\" --run test/session-manager/append-receipt.test.ts test/suite/agent-session-append-receipt.test.ts > \"$EVIDENCE_DIR/append15.stdout\" 2> \"$EVIDENCE_DIR/append15.stderr\"\nstatus=$?\nset -e\nend=$(date +%s%N)\npython3 -I -S - \"$status\" \"$start\" \"$end\" \"$candidate\" <<'PY'\nimport hashlib,json,os,pathlib,sys\nout=pathlib.Path(os.environ['EVIDENCE_DIR']);argv=['node', 'CANDIDATE/node_modules/vitest/dist/cli.js', '--run', 'test/session-manager/append-receipt.test.ts', 'test/suite/agent-session-append-receipt.test.ts'];argv=[v.replace('CANDIDATE',sys.argv[4]) for v in argv]\nr={'phase':'append15','argv':argv,'cwd':os.getcwd(),'exit':int(sys.argv[1]),'started_ns':int(sys.argv[2]),'ended_ns':int(sys.argv[3])}\nfor stream in ['stdout','stderr']:\n b=(out/('append15'+'.'+stream)).read_bytes();r[stream]={'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()}\nwith (out/('append15'+'.phase.json')).open('x') as f:json.dump(r,f,indent=2)\nPY\ncat \"$EVIDENCE_DIR/append15.stdout\"\ncat \"$EVIDENCE_DIR/append15.stderr\" >&2\ncd \"$candidate\"\npython3 -I -S \"$SNAPSHOT\" append15-after\nexit \"$status\"\nPI_JOB\n"
        },
        {
          "name": "npm-check",
          "id": "append_npm_check",
          "if": "${{ !cancelled() && steps.append_dependencies.outcome == 'success' }}",
          "timeout-minutes": 10,
          "run": "env -i PATH=\"$PATH\" HOME=\"$RUNNER_TEMP/pi-append9767/home\" USERPROFILE=\"$RUNNER_TEMP/pi-append9767/home\" \\\n  TMPDIR=\"$RUNNER_TEMP/pi-append9767/tmp\" TMP=\"$RUNNER_TEMP/pi-append9767/tmp\" TEMP=\"$RUNNER_TEMP/pi-append9767/tmp\" \\\n  XDG_CONFIG_HOME=\"$RUNNER_TEMP/pi-append9767/home/.config\" XDG_CACHE_HOME=\"$RUNNER_TEMP/pi-append9767/cache\" \\\n  PI_CODING_AGENT_DIR=\"$RUNNER_TEMP/pi-append9767/home/.pi/agent\" PI_OFFLINE=1 PI_TELEMETRY=0 PI_NO_LOCAL_LLM=1 \\\n  AWS_EC2_METADATA_DISABLED=true CI=true GITHUB_ACTIONS=true LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC \\\n  GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 GIT_ASKPASS=/usr/bin/false GIT_EDITOR=true GIT_SEQUENCE_EDITOR=true \\\n  NPM_CONFIG_USERCONFIG=\"$RUNNER_TEMP/pi-append9767/npm-userconfig\" NPM_CONFIG_GLOBALCONFIG=\"$RUNNER_TEMP/pi-append9767/npm-globalconfig\" \\\n  NPM_CONFIG_CACHE=\"$RUNNER_TEMP/pi-append9767/cache/npm\" npm_config_jobs=1 GOMAXPROCS=2 NODE_OPTIONS=--max-old-space-size=4096 \\\n  STAGE_DIR=\"$RUNNER_TEMP/pi-append9767/stage\" EVIDENCE_DIR=\"$RUNNER_TEMP/pi-append9767/evidence\" \\\n  EXPECTED_MAP=\"$RUNNER_TEMP/pi-append9767/expected-map.json\" SNAPSHOT=\"$RUNNER_TEMP/pi-append9767/snapshot.py\" GIT_OPTIONAL_LOCKS=0 \\\n  bash --noprofile --norc -euo pipefail <<'PI_JOB'\ncandidate=\"$PWD\"\npython3 -I -S \"$SNAPSHOT\" npm-check-before --require-original\nstart=$(date +%s%N)\nset +e\nnpm run check > \"$EVIDENCE_DIR/npm-check.stdout\" 2> \"$EVIDENCE_DIR/npm-check.stderr\"\nstatus=$?\nset -e\nend=$(date +%s%N)\npython3 -I -S - \"$status\" \"$start\" \"$end\" \"$candidate\" <<'PY'\nimport hashlib,json,os,pathlib,sys\nout=pathlib.Path(os.environ['EVIDENCE_DIR']);argv=['npm', 'run', 'check'];argv=[v.replace('CANDIDATE',sys.argv[4]) for v in argv]\nr={'phase':'npm-check','argv':argv,'cwd':os.getcwd(),'exit':int(sys.argv[1]),'started_ns':int(sys.argv[2]),'ended_ns':int(sys.argv[3])}\nfor stream in ['stdout','stderr']:\n b=(out/('npm-check'+'.'+stream)).read_bytes();r[stream]={'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()}\nwith (out/('npm-check'+'.phase.json')).open('x') as f:json.dump(r,f,indent=2)\nPY\ncat \"$EVIDENCE_DIR/npm-check.stdout\"\ncat \"$EVIDENCE_DIR/npm-check.stderr\" >&2\ncd \"$candidate\"\npython3 -I -S \"$SNAPSHOT\" npm-check-after\nexit \"$status\"\nPI_JOB\n"
        },
        {
          "name": "Retain complete or partial stage with modes",
          "if": "always()",
          "timeout-minutes": 3,
          "run": "python3 -I -S \"$RUNNER_TEMP/pi-append9767/snapshot.py\" final\n",
          "env": {
            "EVIDENCE_DIR": "${{ runner.temp }}/pi-append9767/evidence",
            "EXPECTED_MAP": "${{ runner.temp }}/pi-append9767/expected-map.json"
          }
        },
        {
          "name": "Upload actual evidence even after failure",
          "if": "always()",
          "timeout-minutes": 5,
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "pi-append9767-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ runner.temp }}/pi-append9767/evidence",
            "include-hidden-files": true,
            "if-no-files-found": "error",
            "retention-days": 7
          }
        }
      ]
    }
  }
}
